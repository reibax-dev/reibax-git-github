name: Comunicador de la Legiòn del Mal


on:
  workflow_dispatch:
    inputs:
      villano:
        description: "Que villano envìa el mensaje?"
        required: true
        type: choice
        options: 
          - Lex Luthor
          - Magneto
          - Jocker
          - Mystique
          - Green Goblin
      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La mision fue un èxito"       

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options: 
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crìtica
          

jobs:

  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
          echo "Inputs: "
          echo ""
          echo "Villano: ${{ inputs.villano }}"
          echo "Nivel: ${{ inputs.prioridad }}"
          echo "Mensaje: ${{ inputs.mensaje }}"
      
